name: Parser Workflow

on:
  repository_dispatch:
    types: [parse-pdf]

jobs:
  parse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'engine/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt
          pip install httpx rich  # Ensure CLI tools are present

      - name: Install Supabase CLI
        run: |
          npm install -g supabase

      - name: Download PDF from Supabase Storage
        run: |
          # Payload expected: { "book_id": "...", "storage_path": "..." }
          BOOK_ID="${{ github.event.client_payload.book_id }}"
          STORAGE_PATH="${{ github.event.client_payload.storage_path }}"
          
          echo "Downloading PDF for Book ID: $BOOK_ID from path: $STORAGE_PATH"
          
          # Initialize Supabase CLI
          supabase login --token "$SUPABASE_ACCESS_TOKEN"
          
          # Download the file to a temporary location
          supabase storage download "raw_pdfs/$STORAGE_PATH" input.pdf

      - name: Run Parser
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/engine
          python3 -m codex_engine.main input.pdf --output manifest.json --pretty

      - name: Sync Manifest to Database
        run: |
          BOOK_ID="${{ github.event.client_payload.book_id }}"
          python3 scripts/sync_manifest.py "$BOOK_ID" manifest.json
